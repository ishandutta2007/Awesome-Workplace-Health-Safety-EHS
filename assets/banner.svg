<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#062e24" />
    </linearGradient>

    <linearGradient id="emeraldAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="amberAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.4" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filter for soft shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatSoft {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -120; }
      }
      @keyframes statusBlink {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #10b981); }
        50% { opacity: 0.35; filter: drop-shadow(0 0 1px #10b981); }
      }
      @keyframes sweepScan {
        0% { transform: translateX(-100px); opacity: 0; }
        50% { opacity: 0.25; }
        100% { transform: translateX(1300px); opacity: 0; }
      }

      .pulse-bg {
        animation: pulseGlow 7s ease-in-out infinite;
        transform-origin: center;
      }
      .float-elm {
        animation: floatSoft 5s ease-in-out infinite;
      }
      .dash-line {
        stroke-dasharray: 8, 8;
        animation: dashFlow 8s linear infinite;
      }
      .blink-dot {
        animation: statusBlink 2s ease-in-out infinite;
      }
      .scan-light {
        animation: sweepScan 9s ease-in-out infinite;
      }

      .text-heading {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .text-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.2px;
      }
      .text-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 600;
        font-size: 12px;
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="360" rx="20" fill="url(#bgGrad)" />

  <!-- Dynamic Background Geometric Grid / Safety Grid -->
  <g opacity="0.12">
    <path d="M0,60 H1200 M0,120 H1200 M0,180 H1200 M0,240 H1200 M0,300 H1200" stroke="#34d399" stroke-width="0.8" />
    <path d="M120,0 V360 M240,0 V360 M360,0 V360 M480,0 V360 M600,0 V360 M720,0 V360 M840,0 V360 M960,0 V360 M1080,0 V360" stroke="#34d399" stroke-width="0.8" />
  </g>

  <!-- Dynamic Ambient Glowing Orbs (strictly background) -->
  <circle cx="150" cy="80" r="160" fill="url(#emeraldAura)" class="pulse-bg" />
  <circle cx="1060" cy="270" r="180" fill="url(#amberAura)" class="pulse-bg" style="animation-delay: -3s;" />
  <circle cx="980" cy="70" r="130" fill="url(#emeraldAura)" class="pulse-bg" style="animation-delay: -5s;" />

  <!-- Dynamic Dashed Safety Flow Lines (background) -->
  <path d="M-50,80 C300,30 450,150 800,70 S1150,130 1250,90" fill="none" stroke="#10b981" stroke-width="1.8" opacity="0.35" class="dash-line" />
  <path d="M-50,290 C350,330 600,220 900,280 S1150,250 1250,310" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.25" class="dash-line" style="animation-direction: reverse; animation-duration: 11s;" />

  <!-- Animated Scanner Bar in Background -->
  <rect y="0" width="80" height="360" fill="#34d399" opacity="0.04" class="scan-light" />

  <!-- Central Foreground Anchor Container / Content Box (Ensures Foreground Readability) -->
  <g transform="translate(60, 42)">
    <!-- High-contrast backdrop card to safeguard text contrast -->
    <rect width="1080" height="276" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />

    <!-- Corner Safety Chevron Patterns (Decorative Accent) -->
    <g opacity="0.45" transform="translate(1010, 18)">
      <path d="M0,0 L12,12 L24,0 M0,12 L12,24 L24,12 M0,24 L12,36 L24,24" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Top Badge / Category Pill -->
    <g transform="translate(36, 32)">
      <rect width="365" height="30" rx="15" fill="url(#pillGrad)" stroke="#10b981" stroke-width="1" />
      <!-- Status Pulse Indicator -->
      <circle cx="18" cy="15" r="4.5" fill="#10b981" class="blink-dot" />
      <text x="32" y="19.5" fill="#34d399" class="text-mono" font-size="11.5" letter-spacing="1">WORKPLACE HEALTH &amp; SAFETY (EHS)</text>
    </g>

    <!-- Main Title (Strictly Foreground) -->
    <text x="36" y="112" fill="url(#titleGrad)" class="text-heading" font-size="34">Awesome Workplace Health &amp; Safety</text>
    
    <!-- Title Badge EHS -->
    <g transform="translate(670, 83)">
      <rect width="84" height="32" rx="8" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="1.2" />
      <text x="17" y="21" fill="#6ee7b7" class="text-heading" font-size="15" font-weight="700">EHS</text>
    </g>

    <!-- Subtitle (Strictly Foreground) -->
    <text x="36" y="150" fill="#94a3b8" class="text-sub" font-size="15.5">
      Curated directory of SaaS enterprise platforms, incident response suites, compliance trackers &amp; open-source safety tools
    </text>

    <!-- Divider Line -->
    <line x1="36" y1="178" x2="1044" y2="178" stroke="#334155" stroke-width="1" opacity="0.7" />

    <!-- Feature Tags / Metric Pills (Foreground) -->
    <g transform="translate(36, 202)">
      <!-- Pill 1: Incident & CAPA -->
      <g transform="translate(0, 0)">
        <rect width="180" height="38" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="14" y="24" fill="#38bdf8" font-size="15">🚨</text>
        <text x="40" y="23" fill="#cbd5e1" class="text-sub" font-size="12.5" font-weight="600">Incident &amp; CAPA</text>
      </g>

      <!-- Pill 2: OSHA & ISO 45001 -->
      <g transform="translate(192, 0)">
        <rect width="186" height="38" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="14" y="24" fill="#e2e8f0" font-size="15">📜</text>
        <text x="40" y="23" fill="#cbd5e1" class="text-sub" font-size="12.5" font-weight="600">OSHA &amp; ISO 45001</text>
      </g>

      <!-- Pill 3: Field Inspections & JSA -->
      <g transform="translate(390, 0)">
        <rect width="194" height="38" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="14" y="24" fill="#e2e8f0" font-size="15">📋</text>
        <text x="40" y="23" fill="#cbd5e1" class="text-sub" font-size="12.5" font-weight="600">Field Inspections / JSA</text>
      </g>

      <!-- Pill 4: Permit-to-Work (PTW) -->
      <g transform="translate(596, 0)">
        <rect width="196" height="38" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="14" y="24" fill="#e2e8f0" font-size="15">🔒</text>
        <text x="40" y="23" fill="#cbd5e1" class="text-sub" font-size="12.5" font-weight="600">Permit-to-Work &amp; LOTO</text>
      </g>

      <!-- Pill 5: Computer Vision PPE -->
      <g transform="translate(804, 0)">
        <rect width="204" height="38" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="14" y="24" fill="#e2e8f0" font-size="15">🦺</text>
        <text x="40" y="23" fill="#cbd5e1" class="text-sub" font-size="12.5" font-weight="600">AI Vision PPE Detection</text>
      </g>
    </g>

    <!-- Star & Open Source Quality Seal (Right side of card) -->
    <g transform="translate(940, 32)" class="float-elm">
      <rect width="104" height="28" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="0.8" />
      <text x="12" y="18" fill="#34d399" class="text-mono" font-size="10.5">🌟 100% CURATED</text>
    </g>
  </g>
</svg>
